<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Sweets Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/style.css">
    <style>
        /* ── Login page standalone styles ── */
        .login-page {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 20% 20%, rgba(232, 121, 168, 0.12) 0px, transparent 55%),
                radial-gradient(at 80% 80%, rgba(216, 180, 226, 0.08) 0px, transparent 55%);
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
            animation: card-fadein 0.5s ease both;
        }

        @keyframes card-fadein {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .login-logo img {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 4px 20px rgba(232, 121, 168, 0.4));
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--text-main);
            text-align: center;
            margin-bottom: 0.35rem;
        }

        .login-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-error {
            background: rgba(230, 57, 70, 0.12);
            border: 1px solid rgba(230, 57, 70, 0.35);
            color: #ff6b75;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .login-form .form-group {
            margin-bottom: 1rem;
        }

        .login-form label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .login-form .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: var(--transition-smooth);
            -webkit-appearance: none;
        }

        .login-form .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(232, 121, 168, 0.18);
        }

        .login-btn {
            width: 100%;
            background: var(--primary);
            color: var(--text-dark);
            border: none;
            border-radius: 10px;
            padding: 0.95rem;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            margin-top: 0.5rem;
            letter-spacing: 0.03em;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(232, 121, 168, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-back {
            display: block;
            text-align: center;
            margin-top: 1.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .login-back:hover {
            color: var(--primary);
        }

        .login-back svg {
            vertical-align: middle;
            margin-right: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <img src="./static/images/logo.png" alt="Sweets Lab">
            </div>
            <h1 class="login-title">Admin Access</h1>
            <p class="login-subtitle">Sign in to manage your menu</p>

            

            <form method="POST" action="/admin/login" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        autocomplete="username"
                        autocapitalize="none"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" class="login-btn" id="btn-login">Sign In →</button>
            </form>

            <a href="./index.html" class="login-back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                Back to Menu
            </a>
        </div>
    </div>
</body>
</html>
